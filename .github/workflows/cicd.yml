name: complete deployment

on:
  push: 
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

jobs:
  build:
    name: Build Python App
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from the repository
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Set up the Python interpreter environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Change to your preferred Python version (e.g., '3.10', '3.12')
          cache: 'pip'          # Automatically caches dependencies for faster subsequent runs

      # 3. Upgrade pip and install all project dependencies
      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
         
